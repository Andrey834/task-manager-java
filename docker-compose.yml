services:

  pg-tms:
    image: postgres:16-alpine
    container_name: tms-db
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - tms-pg-data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${TMS_PG_DB}
      - POSTGRES_PASSWORD=${TMS_PG_PASSWORD}
      - POSTGRES_USER=${TMS_PG_USER}
    ports:
      - ${TMS_PG_PORT}:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TMS_PG_USER} -d ${TMS_PG_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Kafka в режиме KRaft (без ZooKeeper) — актуальный стандарт с Kafka 3.3+,
  # брокер сам выполняет роль controller'а метаданных кластера
  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: tms-kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
      - "9092:9092"
    environment:
      CLUSTER_ID: 'MkU3OEVBNTcwNTJENDM2Qk'
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://0.0.0.0:29092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server kafka:9092"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    container_name: kafka-ui
    restart: unless-stopped
    depends_on:
      - kafka
    ports:
      - "9879:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: true

  tms:
    build: .
    image: ${TMS_NAME}
    container_name: ${TMS_NAME}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      pg-tms:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - ${TMS_PORT}:${TMS_PORT}
    environment:
      - TMS_PG_URL=jdbc:postgresql://tms-db:5432/${TMS_PG_DB}
      - TMS_PG_USER=${TMS_PG_USER}
      - TMS_PG_PASSWORD=${TMS_PG_PASSWORD}
      - TMS_NAME=${TMS_NAME}
      - TMS_PORT=${TMS_PORT}
      - TMS_KAFKA_SERVER=kafka:9092
      - TMS_EMAIL_USER=${TMS_EMAIL_USER}
      - TMS_EMAIL_PASSWORD=${TMS_EMAIL_PASSWORD}

volumes:
  tms-pg-data:
